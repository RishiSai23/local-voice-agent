<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="32" cy="32" r="30" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 4" />
  <circle cx="32" cy="32" r="26" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6" />
  <!-- Arc Segments -->
  <path d="M14 32 A18 18 0 0 1 32 14" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <path d="M50 32 A18 18 0 0 1 32 50" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <!-- Tri-Emitter Spokes -->
  <circle cx="32" cy="32" r="14" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" />
  <!-- Glowing Core -->
  <circle cx="32" cy="32" r="8" fill="url(#reactorCore)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>