[package]
name = "jarvis-companion"
version = "0.1.0"
description = "Native Windows Floating Companion for J.A.R.V.I.S. Local Voice Agent"
authors = ["JARVIS Local Voice Agent"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
